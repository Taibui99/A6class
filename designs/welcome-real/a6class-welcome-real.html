<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A6Class — Xin chào</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#1E40AF; --navy-dark:#16306E; --ink:#1C1917; --ink-soft:#57534E; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; font-family:'Be Vietnam Pro',sans-serif; background:#FBEFE6; }
  .page{ max-width:1100px; margin:0 auto; padding:18px; }
  .stage-outer{ position:relative; width:100%; }
  .stage-outer::before{ content:''; display:block; padding-top:66.667%; }
  .stage{
    position:absolute; inset:0; width:100%; height:100%; border-radius:22px; overflow:hidden;
    box-shadow:0 20px 50px rgba(60,40,30,.18);
    background:linear-gradient(180deg,#F6C6A8 0%,#F8D3B9 26%,#FBE0C9 46%,#FDECDD 66%,#FEF6ED 84%,#FFFBF6 100%);
  }
  .layer{ position:absolute; }
  .layer img{ width:100%; height:100%; display:block; }

  .dawn-overlay{ position:absolute; inset:0; z-index:5; pointer-events:none;
    background:linear-gradient(180deg,rgba(40,30,40,.55),rgba(40,30,40,.15) 55%,rgba(40,30,40,0) 100%);
    animation:dawnLift 2s ease-out .1s forwards;
  }
  @keyframes dawnLift{ to{ opacity:0; } }

  #sun{ z-index:2; animation:sunrise 2.1s cubic-bezier(.2,.7,.3,1) .15s both; }
  @keyframes sunrise{
    0%{ transform:translateY(60%); opacity:0; }
    10%{ opacity:1; }
    100%{ transform:translateY(0); opacity:1; }
  }
  #hillFarLeft{ z-index:3; }
  #hillFarRight{ z-index:3; }
  #school{ z-index:4; filter:drop-shadow(0 4px 6px rgba(90,40,20,.15)); }
  #treesRight{ z-index:4; }
  #treeSmall1, #treeSmall2{ z-index:4; }
  .sway{ transform-origin:50% 92%; animation:sway 4s ease-in-out infinite; }
  @keyframes sway{ 0%,100%{ transform:rotate(-1deg);} 50%{ transform:rotate(1deg);} }
  #hillNearPath{ z-index:6; }
  #hillNearPlain{ z-index:9; }

  .prop{ z-index:7; opacity:0; transform:translateY(10px) scale(.85);
    animation:popIn .6s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes popIn{ to{ opacity:1; transform:translateY(0) scale(1);} }
  #star{ animation-delay:3.1s; }
  #star img{ animation:twinkle 2.6s ease-in-out infinite 3.8s; }
  @keyframes twinkle{ 0%,100%{ transform:scale(1) rotate(0deg);} 50%{ transform:scale(1.1) rotate(6deg);} }
  #bell{ animation-delay:3.3s; }
  #bell img{ transform-origin:50% 8%; animation:bellswing 3s ease-in-out infinite 3.9s; }
  @keyframes bellswing{ 0%,100%{ transform:rotate(0deg);} 50%{ transform:rotate(7deg);} }
  #globe{ animation-delay:2.9s; }
  #rocket{ animation-delay:3.2s; }
  #book{ animation-delay:2.7s; }

  #robotWrap{ z-index:8; opacity:0; transform:translate(-60%,10%) scale(.85);
    animation:robotIn 1s cubic-bezier(.22,.9,.3,1.15) 2.15s forwards; }
  @keyframes robotIn{ to{ opacity:1; transform:translate(0,0) scale(1);} }
  #robotWrap .bob{ animation:idleBob 3.3s ease-in-out infinite 3.2s; }
  @keyframes idleBob{ 0%,100%{ transform:translateY(0) rotate(0deg);} 50%{ transform:translateY(-1.5%) rotate(-1.2deg);} }
  #robotWrap .greetWiggle{ animation:wiggle .55s ease-in-out 3.1s 3; transform-origin:70% 55%; }
  @keyframes wiggle{ 0%,100%{ transform:rotate(0deg);} 35%{ transform:rotate(-4deg);} 65%{ transform:rotate(2deg);} }
  .robot-shadow{ position:absolute; z-index:7; left:52%; bottom:19%; width:15%; aspect-ratio:5/1; border-radius:50%;
    background:rgba(30,45,20,.22); filter:blur(3px); opacity:0; transform:scale(.6);
    animation:shadowIn 1s ease-out 2.2s forwards; }
  @keyframes shadowIn{ to{ opacity:1; transform:scale(1);} }

  /* eye/symbol overlay patch sits over the robot's visor */
  .facepatch{ position:absolute; left:38%; top:24%; width:26%; height:13%; z-index:9; pointer-events:none; }
  .facepatch .bg{ position:absolute; inset:-18% -10%; background:#252C46; border-radius:50%; opacity:0; transition:opacity .15s; }
  .facepatch.active .bg{ opacity:1; }
  .facepatch svg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }

  .bubble{ position:absolute; left:48%; top:14%; max-width:42%; z-index:10;
    background:#fff; border-radius:16px; padding:6px 12px; font-weight:700; font-size:clamp(11px,1.7vw,16px); color:var(--navy-dark);
    box-shadow:0 8px 18px rgba(60,40,30,.15); opacity:0; transform:scale(.6); transform-origin:15% 120%;
    transition:opacity .25s cubic-bezier(.34,1.56,.64,1), transform .25s cubic-bezier(.34,1.56,.64,1);
    pointer-events:none; white-space:nowrap;
  }
  .bubble::after{ content:''; position:absolute; left:18%; bottom:-6px; width:12px; height:12px; background:#fff;
    clip-path:polygon(0 0,100% 0,0 100%); }
  .bubble.show{ opacity:1; transform:scale(1); }

  .logo{ position:absolute; top:3%; left:50%; transform:translateX(-50%); z-index:11; display:flex; gap:1px; }
  .logo span{ font-weight:800; font-size:clamp(18px,3.2vw,32px); color:#8C3B24;
    text-shadow:0 2px 0 rgba(255,255,255,.55);
    opacity:0; transform:translateY(-18px);
    animation:letterBounce .6s cubic-bezier(.34,1.6,.5,1) forwards; }
  @keyframes letterBounce{ to{ opacity:1; transform:translateY(0);} }

  .cta{ position:absolute; left:50%; bottom:4%; transform:translateX(-50%); z-index:12;
    width:min(80%,360px); display:flex; flex-direction:column; gap:8px;
    opacity:0; animation:fadeUp .6s ease-out 4.6s forwards; }
  @keyframes fadeUp{ to{ opacity:1; } }
  .btn{ display:flex; align-items:center; justify-content:center; gap:8px; height:44px; border-radius:12px;
    font-family:inherit; font-weight:700; font-size:clamp(12px,1.6vw,15px); cursor:pointer; border:none; }
  .btn-primary{ background:linear-gradient(180deg,#3B82F6,var(--navy)); color:#fff; box-shadow:0 5px 0 var(--navy-dark); }
  .btn-secondary{ background:#fff; color:var(--navy-dark); border:1px solid #E7E5E4; }

  .panel{ margin-top:20px; background:#fff; border-radius:18px; padding:18px 20px; box-shadow:0 4px 20px rgba(60,40,30,.08); }
  .panel h3{ margin:0 0 4px; font-size:15px; color:var(--ink); }
  .panel p{ margin:0 0 14px; font-size:13px; color:var(--ink-soft); }
  .row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .chip{ border:1px solid #E7E5E4; background:#FAFAF9; border-radius:999px; padding:8px 14px;
    font-family:inherit; font-size:13px; font-weight:700; color:var(--navy-dark); cursor:pointer; }
  .chip:hover{ background:#EFF6FF; }
  .textrow{ display:flex; gap:8px; }
  .textrow input{ flex:1; border:1px solid #E7E5E4; border-radius:10px; padding:10px 12px; font-family:inherit; font-size:14px; }
  .textrow button{ border:none; background:var(--navy); color:#fff; font-weight:700; border-radius:10px; padding:10px 16px; cursor:pointer; font-family:inherit; }

  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.01ms !important; animation-delay:0s !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="stage-outer">
  <div class="stage" id="stage">

    <div class="dawn-overlay"></div>

    <div class="layer" id="sun" style="left:43.95%; top:4.79%; width:20.12%; height:16.21%;">
      <img src="assets/sun.png" alt="">
    </div>
    <div class="layer" id="hillFarRight" style="left:51.95%; top:12.01%; width:47.33%; height:17.29%;">
      <img src="assets/hill-far-right.png" alt="">
    </div>
    <div class="layer" id="hillFarLeft" style="left:1.17%; top:20.02%; width:46.68%; height:9.57%;">
      <img src="assets/hill-far-left.png" alt="">
    </div>

    <div class="layer" id="school" style="left:4.30%; top:30.18%; width:23.50%; height:31.45%;">
      <img src="assets/school.png" alt="">
    </div>
    <div class="layer" id="treesRight" style="left:73.83%; top:30.37%; width:24.80%; height:34.77%;">
      <img class="sway" src="assets/trees-bush-right.png" alt="">
    </div>
    <div class="layer" id="treeSmall1" style="left:30.08%; top:34.08%; width:10.94%; height:19.53%;">
      <img class="sway" src="assets/tree-small-1.png" alt="">
    </div>
    <div class="layer" id="treeSmall2" style="left:41.41%; top:36.04%; width:8.40%; height:16.99%;">
      <img class="sway" src="assets/tree-small-2.png" alt="">
    </div>

    <div class="layer" id="hillNearPath" style="left:1.76%; top:58.50%; width:49.02%; height:11.91%;">
      <img src="assets/hill-near-path.png" alt="">
    </div>

    <div class="robot-shadow"></div>
    <div class="layer" id="robotWrap" style="left:50.00%; top:33.50%; width:20.25%; height:40.23%;">
      <div class="bob">
        <div class="greetWiggle" style="position:relative; width:100%; height:100%;">
          <img src="assets/robot.png" alt="Robot A6Class" style="width:100%; height:100%;">
          <div class="facepatch" id="facepatch">
            <div class="bg"></div>
            <svg viewBox="0 0 100 100" id="faceSvg"></svg>
          </div>
        </div>
      </div>
    </div>
    <div class="bubble" id="bubble"></div>

    <div class="layer prop" id="book" style="left:15.04%; top:69.43%; width:16.80%; height:15.62%;">
      <img src="assets/book.png" alt="">
    </div>
    <div class="layer prop" id="globe" style="left:34.51%; top:67.48%; width:7.88%; height:14.26%;">
      <img src="assets/globe.png" alt="">
    </div>
    <div class="layer prop" id="rocket" style="left:72.66%; top:67.48%; width:8.40%; height:10.16%;">
      <img src="assets/rocket.png" alt="">
    </div>
    <div class="layer prop" id="star" style="left:83.27%; top:66.60%; width:6.18%; height:8.50%;">
      <img src="assets/star.png" alt="">
    </div>
    <div class="layer prop" id="bell" style="left:88.35%; top:67.09%; width:8.33%; height:17.48%;">
      <img src="assets/bell.png" alt="">
    </div>

    <div class="layer" id="hillNearPlain" style="left:0.98%; top:78.03%; width:98.24%; height:19.73%;">
      <img src="assets/hill-near-plain.png" alt="">
    </div>

    <div class="logo" id="logo"></div>
    <div class="cta">
      <button class="btn btn-primary">Đăng ký tham gia →</button>
      <button class="btn btn-secondary">Đã có tài khoản? Đăng nhập</button>
    </div>
  </div>
  </div>

  <div class="panel">
    <h3>Thử biểu cảm &amp; hiển thị của robot</h3>
    <p>Bấm để xem robot đổi mắt, hiện icon trên màn hình mặt, hoặc nói một câu tuỳ ý.</p>
    <div class="row" id="expressionRow"></div>
    <div class="row" id="symbolRow"></div>
    <div class="textrow">
      <input id="textInput" type="text" placeholder="Nhập câu robot sẽ nói…" maxlength="40">
      <button id="sayBtn">Nói</button>
    </div>
  </div>
</div>

<script>
(function(){
  const patch = document.getElementById('facepatch');
  const faceSvg = document.getElementById('faceSvg');
  const bubble = document.getElementById('bubble');

  const EYE_YELLOW = '#F5D98A';

  const eyeShapes = {
    default: null, // no overlay needed, shows the original image eyes
    vui: `<path d="M28 58 Q40 40 52 58" stroke="${EYE_YELLOW}" stroke-width="8" fill="none" stroke-linecap="round"/>
          <path d="M64 58 Q76 40 88 58" stroke="${EYE_YELLOW}" stroke-width="8" fill="none" stroke-linecap="round"/>`,
    ngac_nhien: `<circle cx="38" cy="55" r="15" fill="${EYE_YELLOW}"/><circle cx="78" cy="55" r="15" fill="${EYE_YELLOW}"/>
          <circle cx="38" cy="50" r="4.5" fill="#22293F"/><circle cx="78" cy="50" r="4.5" fill="#22293F"/>`,
    buon_ngu: `<path d="M24 56 L52 56" stroke="${EYE_YELLOW}" stroke-width="7" stroke-linecap="round"/>
          <path d="M64 56 L92 56" stroke="${EYE_YELLOW}" stroke-width="7" stroke-linecap="round"/>`,
    yeu: (()=>{ const h=(cx,cy)=>`M${cx} ${cy+9} C${cx-14} ${cy-4} ${cx-8} ${cy-18} ${cx} ${cy-8} C${cx+8} ${cy-18} ${cx+14} ${cy-4} ${cx} ${cy+9} Z`;
          return `<path d="${h(38,58)}" fill="#F0607A"/><path d="${h(78,58)}" fill="#F0607A"/>`; })()
  };
  const symbolShapes = {
    star: `<path d="M58 30 L66 50 L88 51 L70 64 L76 85 L58 73 L40 85 L46 64 L28 51 L50 50 Z" fill="#F3C94D"/>`,
    heart: `<path d="M58 74 C32 56 38 28 58 40 C78 28 84 56 58 74 Z" fill="#F0607A"/>`,
    exclaim: `<rect x="50" y="28" width="16" height="34" rx="8" fill="${EYE_YELLOW}"/><circle cx="58" cy="74" r="7" fill="${EYE_YELLOW}"/>`,
    note: `<circle cx="42" cy="76" r="10" fill="${EYE_YELLOW}"/><rect x="50" y="24" width="5" height="52" fill="${EYE_YELLOW}"/><path d="M50 24 L80 32 L80 44 L50 36 Z" fill="${EYE_YELLOW}"/>`,
    question: `<path d="M40 34 C40 18 78 18 78 36 C78 50 60 50 60 66" stroke="${EYE_YELLOW}" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="60" cy="84" r="6" fill="${EYE_YELLOW}"/>`
  };

  function clearFace(){ patch.classList.remove('active'); faceSvg.innerHTML=''; }
  function setEyes(name){
    if(!name || name==='default'){ clearFace(); return; }
    patch.classList.add('active');
    faceSvg.innerHTML = eyeShapes[name] || '';
  }
  function showSymbol(name, duration){
    patch.classList.add('active');
    faceSvg.innerHTML = symbolShapes[name] || '';
    clearTimeout(patch._t);
    patch._t = setTimeout(clearFace, duration || 2200);
  }
  function say(text){
    if(!text) return;
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(bubble._t);
    bubble._t = setTimeout(()=> bubble.classList.remove('show'), 2600);
  }
  window.A6Robot = { setEyes, showSymbol, say };

  const expressionRow = document.getElementById('expressionRow');
  [['Vui','vui'],['Ngạc nhiên','ngac_nhien'],['Buồn ngủ','buon_ngu'],['Yêu','yeu'],['Bình thường','default']]
    .forEach(([label,key])=>{
      const b=document.createElement('button'); b.className='chip'; b.textContent=label;
      b.onclick=()=>setEyes(key); expressionRow.appendChild(b);
    });
  const symbolRow = document.getElementById('symbolRow');
  [['⭐ Sao','star'],['❤️ Tim','heart'],['❗ Chú ý','exclaim'],['🎵 Nhạc','note'],['❓ Hỏi','question']]
    .forEach(([label,key])=>{
      const b=document.createElement('button'); b.className='chip'; b.textContent=label;
      b.onclick=()=>showSymbol(key); symbolRow.appendChild(b);
    });
  document.getElementById('sayBtn').onclick=()=>{
    say(document.getElementById('textInput').value.trim());
  };
  document.getElementById('textInput').addEventListener('keydown', e=>{
    if(e.key==='Enter') document.getElementById('sayBtn').click();
  });

  const logo = document.getElementById('logo');
  [..."A6Class"].forEach((ch,i)=>{
    const span=document.createElement('span'); span.textContent=ch;
    span.style.animationDelay=(1.4+i*0.06)+'s'; logo.appendChild(span);
  });

  setTimeout(()=> say('Xin chào!'), 3100);
})();
</script>
</body>
</html>
